# CI de Gotcha sur CircleCI (plan gratuit). Les huit jobs sont obligatoires pour
# fusionner dans main (voir .github/rulesets/protection-main.json).
# Détails : .circleci/README.md. En local, la même chose : python scripts/check.py
version: 2.1

executors:
  python:
    parameters:
      version:
        type: string
        default: "3.12"
    docker:
      - image: cimg/python:<< parameters.version >>
    resource_class: small
  python-node:
    docker:
      - image: cimg/python:3.12-node
    resource_class: small
  # Tests : une base PostgreSQL jetable par job, pour les tests de contrat de PostgresStore.
  python-postgres:
    parameters:
      version:
        type: string
    docker:
      - image: cimg/python:<< parameters.version >>
      - image: cimg/postgres:17.9
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gotcha_test
    resource_class: small
    environment:
      GOTCHA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gotcha_test

commands:
  install:
    description: Installer les dépendances de développement (avec cache pip)
    steps:
      - restore_cache:
          keys:
            - pip-v1-{{ .Environment.CIRCLE_JOB }}-{{ checksum "requirements.txt" }}-{{ checksum "requirements-dev.txt" }}
      - run:
          name: Installation
          command: python -m pip install --quiet -r requirements-dev.txt
      - save_cache:
          key: pip-v1-{{ .Environment.CIRCLE_JOB }}-{{ checksum "requirements.txt" }}-{{ checksum "requirements-dev.txt" }}
          paths:
            - ~/.cache/pip

  wait-ready:
    description: Attendre que le conteneur réponde, base PostgreSQL comprise
    steps:
      - run:
          name: Attente du site (/healthz?db=1)
          command: |
            for i in $(seq 1 60); do
              # Sortie capturée, puis grep sans tube : avec pipefail, « … | grep -q » peut
              # échouer quand grep s'arrête au premier résultat (SIGPIPE pour l'émetteur).
              health="$(curl -fsS 'http://localhost:8000/healthz?db=1' 2>/dev/null || true)"
              if grep -q '"database":"ok"' <<<"$health"; then
                echo "Site prêt après ${i} s"
                exit 0
              fi
              sleep 1
            done
            echo "ÉCHEC : le site ne répond pas après 60 s"
            exit 1

jobs:
  pr-rules:
    executor: python
    steps:
      - checkout
      - run:
          name: "Titre de PR au format « type(zone): description »"
          command: python scripts/ci_pr_rules.py

  lint:
    executor: python-node
    steps:
      - checkout
      - install
      - run:
          name: Lint (ruff)
          command: python -m ruff check .
      - run:
          name: Format (ruff)
          command: python -m ruff format --check --diff .
      - run:
          name: Types (pyright)
          command: python -m pyright --pythonpath "$(command -v python)"
      - run:
          name: Secrets dans le dépôt
          command: python scripts/scan_secrets.py

  tests:
    parameters:
      python:
        type: string
    executor:
      name: python-postgres
      version: << parameters.python >>
    steps:
      - checkout
      - install
      - run:
          name: Attendre PostgreSQL
          command: |
            for i in $(seq 1 30); do
              python -c "import socket; socket.create_connection(('localhost', 5432), 1)" 2>/dev/null && exit 0
              sleep 1
            done
            echo "ÉCHEC : PostgreSQL ne répond pas après 30 s"
            exit 1
      - run:
          name: Tests et couverture (85 % minimum), PostgreSQL compris
          command: |
            mkdir -p test-results
            python -m pytest --cov --cov-report=term-missing:skip-covered --junitxml=test-results/junit.xml
      - store_test_results:
          path: test-results

  licences:
    executor: python
    steps:
      - checkout
      - run:
          name: Licences des dépendances livrées (environnement neuf)
          command: |
            python -m venv /tmp/prod
            /tmp/prod/bin/pip install --quiet -r requirements.txt
            /tmp/prod/bin/python scripts/check_licenses.py --list

  docker:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Construction de l'image
          command: docker build --pull -t gotcha:ci .
      - run:
          name: Base PostgreSQL jetable, comme la base managée de Datacloud
          command: |
            docker network create gotcha
            docker run -d --name db --network gotcha \
              -e POSTGRES_USER=gotcha -e POSTGRES_PASSWORD=gotcha -e POSTGRES_DB=gotcha \
              postgres:17-alpine
            # Par TCP : pendant son initialisation, le serveur n'écoute que sur un socket local.
            for i in $(seq 1 60); do
              if docker exec db pg_isready -h 127.0.0.1 -U gotcha -d gotcha > /dev/null 2>&1; then
                echo "Base prête après ${i} s"
                exit 0
              fi
              sleep 1
            done
            echo "ÉCHEC : la base ne répond pas après 60 s"
            exit 1
      - run:
          name: Démarrage en mode production (migrations et contenu chargés au démarrage)
          command: |
            docker run -d --name gotcha --network gotcha -p 8000:8000 \
              -e GOTCHA_ENV=prod -e GOTCHA_INGEST_LIVE=false \
              -e DATABASE_URL=postgresql://gotcha:gotcha@db:5432/gotcha \
              -e GOTCHA_SITE_URL=https://gotcha.example \
              -e GOTCHA_GITHUB_CLIENT_ID=ci -e GOTCHA_GITHUB_CLIENT_SECRET=ci \
              gotcha:ci
      - wait-ready
      - run:
          name: Redémarrage (deuxième mise en service, sans rien casser)
          command: docker restart gotcha
      - wait-ready
      - run:
          name: Vérifications en mode production
          command: |
            set -eu
            code() { curl -s -o /dev/null -w '%{http_code}' "http://localhost:8000$1"; }
            test "$(code /)" = 200 || { echo "ÉCHEC : l'accueil ne répond pas 200"; exit 1; }
            test "$(code /styleguide)" = 404 || { echo "ÉCHEC : /styleguide doit être caché"; exit 1; }
            test "$(code /relecture)" = 404 || { echo "ÉCHEC : /relecture doit être fermée"; exit 1; }
            test "$(code /_sonde/requete)" = 404 || { echo "ÉCHEC : la sonde doit être éteinte"; exit 1; }
            # Sorties capturées, puis grep sans tube (voir wait-ready : pipefail et SIGPIPE).
            logs="$(docker logs gotcha 2>&1)"
            grep -q "la base est à jour" <<<"$logs" \
              || { echo "ÉCHEC : le redémarrage aurait dû trouver la base à jour"; exit 1; }
            headers="$(curl -sI http://localhost:8000/)"
            for header in content-security-policy strict-transport-security x-content-type-options x-frame-options; do
              grep -qi "^$header:" <<<"$headers" || { echo "ÉCHEC : en-tête $header absent"; exit 1; }
            done
            # Sorties capturées, puis grep sans tube : avec pipefail, « … | grep -q » peut
            # échouer quand grep s'arrête au premier résultat (SIGPIPE pour l'émetteur).
            mcp() {
              curl -sS -X POST "http://localhost:$1/mcp" -D - \
                -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
                -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' || true
            }
            answer="$(mcp 8000)"
            grep -qi '^www-authenticate: bearer' <<<"$answer" \
              || { echo "ÉCHEC : le serveur MCP doit demander une connexion"; exit 1; }
            discovery="$(curl -fsS http://localhost:8000/.well-known/oauth-authorization-server || true)"
            grep -q '"issuer":"https://gotcha.example"' <<<"$discovery" \
              || { echo "ÉCHEC : la découverte OAuth ne répond pas"; exit 1; }
            # Plan de secours : lecture libre, aucun outil d'écriture.
            docker run -d --name secours --network gotcha -p 8001:8000 \
              -e GOTCHA_ENV=prod -e GOTCHA_INGEST_LIVE=false -e GOTCHA_MCP_AUTH=false -e GOTCHA_SITE_AUTH=false \
              -e DATABASE_URL=postgresql://gotcha:gotcha@db:5432/gotcha \
              -e GOTCHA_SITE_URL=http://localhost:8001 \
              gotcha:ci
            for _ in $(seq 1 30); do
              curl -fsS http://localhost:8001/healthz > /dev/null 2>&1 && break
              sleep 2
            done
            tools="$(mcp 8001)"
            grep -q '"get_fiche"' <<<"$tools" \
              || { echo "ÉCHEC : le serveur MCP de secours ne répond pas"; docker logs secours; exit 1; }
            if grep -q '"report_outage"' <<<"$tools"; then
              echo "ÉCHEC : le plan de secours ne doit exposer aucun outil d'écriture"; exit 1
            fi
            echo "Accueil, pages cachées, en-têtes de sécurité, connexion MCP et plan de secours : OK"
      - run:
          name: Journaux du conteneur
          when: always
          command: docker logs gotcha || true

  audit:
    executor: python
    steps:
      - checkout
      - run:
          name: Failles connues (pip-audit, environnement isolé)
          command: |
            python -m venv /tmp/audit
            /tmp/audit/bin/pip install --quiet pip-audit==2.10.1
            /tmp/audit/bin/pip-audit -r requirements.txt --progress-spinner off --desc

workflows:
  qualite:
    jobs:
      - pr-rules
      - lint
      - tests:
          name: tests-py<< matrix.python >>
          matrix:
            parameters:
              python: ["3.11", "3.12", "3.13"]
      - licences
      - docker
      - audit
