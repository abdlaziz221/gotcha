# Livraison : l'image Docker se construit et démarre en mode production, et aucune
# dépendance n'a de faille connue. Lancé sur main, sur les PR qui touchent au code,
# chaque lundi, et à la demande (onglet Actions).
name: Livraison

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "app/**"
      - "content/**"
      - "fixtures/**"
      - "migrations/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/livraison.yml"
  schedule:
    - cron: "17 6 * * 1"  # chaque lundi à 6 h 17 GMT
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livraison-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    name: Image Docker (construction et démarrage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Construction de l'image
        run: docker build --pull -t gotcha:ci .

      - name: Démarrage en mode production
        run: |
          docker run -d --name gotcha -p 8000:8000 \
            -e GOTCHA_ENV=prod -e GOTCHA_STORE=memory -e GOTCHA_INGEST_LIVE=false \
            -e GOTCHA_SITE_URL=http://localhost:8000 \
            gotcha:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "Conteneur prêt après ${i} s"
              exit 0
            fi
            sleep 1
          done
          echo "::error title=Démarrage::le conteneur ne répond pas après 30 s"
          exit 1

      - name: Vérifications en mode production
        run: |
          set -eu
          code() { curl -s -o /dev/null -w '%{http_code}' "http://localhost:8000$1"; }
          test "$(code /)" = 200 || { echo "::error::l'accueil ne répond pas 200"; exit 1; }
          test "$(code /styleguide)" = 404 || { echo "::error::/styleguide doit être caché en production"; exit 1; }
          test "$(code /relecture)" = 404 || { echo "::error::/relecture doit être fermée sans relecteur"; exit 1; }
          headers="$(curl -sI http://localhost:8000/)"
          for header in content-security-policy strict-transport-security x-content-type-options x-frame-options; do
            printf '%s' "$headers" | grep -qi "^$header:" || { echo "::error::en-tête $header absent"; exit 1; }
          done
          curl -fsS -X POST http://localhost:8000/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | grep -q '"get_fiche"' \
            || { echo "::error::le serveur MCP ne répond pas"; exit 1; }
          echo "Accueil, pages cachées, en-têtes de sécurité et serveur MCP : OK"

      - name: Journaux du conteneur
        if: always()
        run: docker logs gotcha || true

  audit:
    name: Failles connues (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # pip-audit tourne dans un environnement isolé (pipx) : il n'est jamais livré.
      - name: Audit de requirements.txt
        run: pipx run --spec pip-audit==2.10.1 pip-audit -r requirements.txt --progress-spinner off --desc
