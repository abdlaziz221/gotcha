# CI : contrôles obligatoires avant toute fusion dans main (voir .github/workflows/README.md).
# En local, la même chose en une commande : python scripts/check.py
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  pr-rules:
    name: Règles de PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Titre au format « type(zone): description »"
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          title = os.environ["TITLE"]
          types = "feat|fix|content|style|refactor|perf|test|docs|chore|ci|build|revert"
          if re.fullmatch(rf"({types})(\([a-z0-9][a-z0-9-]*\))?!?: \S.{{2,88}}", title):
              print(f"Titre conforme : {title}")
          else:
              print(f"::error title=Titre de PR::« {title} » ne suit pas le format "
                    "type(zone): description, ex. feat(web): mode pas à pas (CONTRIBUTING.md).")
              sys.exit(1)
          PY

      - name: Taille de la PR (avertissement au-delà de 400 lignes)
        env:
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          total=$((ADDITIONS + DELETIONS))
          echo "Lignes modifiées : $total"
          if [ "$total" -gt 400 ]; then
            echo "::warning title=PR volumineuse::$total lignes modifiées : découpez si possible (règle : moins de 400, hors contenu)."
          fi

      - name: Nom de branche « prénom/tâche-sujet » (avertissement)
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if ! printf '%s' "$BRANCH" | grep -Eq '^((aziz|loum|khalifa)/[A-Za-z0-9]+-[a-z0-9-]+|dependabot/.+)$'; then
            echo "::warning title=Nom de branche::« $BRANCH » ne suit pas prénom/tâche-sujet, ex. loum/L3-page-fiche."
          fi

  lint:
    name: Lint, types et secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installation
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check --output-format=github .
      - name: Format (ruff)
        run: ruff format --check --diff .
      - name: Types (pyright)
        run: pyright --pythonpath "$(command -v python)"
      - name: Secrets dans le dépôt
        run: python scripts/scan_secrets.py

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    # Décommenter quand PostgresStore est écrit (tâches A3 à A5) :
    # services:
    #   postgres:
    #     image: postgres:16
    #     env:
    #       POSTGRES_PASSWORD: postgres
    #       POSTGRES_DB: gotcha_test
    #     ports: ["5432:5432"]
    #     options: >-
    #       --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    # env:
    #   GOTCHA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gotcha_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installation
        run: pip install -r requirements-dev.txt
      - name: Tests et couverture (85 % minimum)
        run: pytest --cov --cov-report=term-missing:skip-covered
      - name: Résumé de la couverture
        if: always() && matrix.python == '3.12'
        run: |
          echo "## Couverture des tests" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

  licences:
    name: Licences (dépendances livrées)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Environnement neuf avec les seules dépendances de production : ce qui est livré.
      - name: Contrôle des licences
        run: |
          python -m venv /tmp/prod
          /tmp/prod/bin/pip install -r requirements.txt
          /tmp/prod/bin/python scripts/check_licenses.py --list
