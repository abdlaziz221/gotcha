# CI : contrôles obligatoires avant toute fusion dans main (voir .github/workflows/README.md).
# En local, la même chose en une commande : python scripts/check.py
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  pr-rules:
    name: Règles de PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Titre (bloquant), taille et nom de branche (avertissements)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_ADDITIONS: ${{ github.event.pull_request.additions }}
          PR_DELETIONS: ${{ github.event.pull_request.deletions }}
          PR_BRANCH: ${{ github.head_ref }}
        run: python3 scripts/ci_pr_rules.py

  lint:
    name: Lint, types et secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installation
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check --output-format=github .
      - name: Format (ruff)
        run: ruff format --check --diff .
      - name: Types (pyright)
        run: pyright --pythonpath "$(command -v python)"
      - name: Secrets dans le dépôt
        run: python scripts/scan_secrets.py

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    # Décommenter quand PostgresStore est écrit (tâches A3 à A5) :
    # services:
    #   postgres:
    #     image: postgres:16
    #     env:
    #       POSTGRES_PASSWORD: postgres
    #       POSTGRES_DB: gotcha_test
    #     ports: ["5432:5432"]
    #     options: >-
    #       --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    # env:
    #   GOTCHA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gotcha_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installation
        run: pip install -r requirements-dev.txt
      - name: Tests et couverture (85 % minimum)
        run: pytest --cov --cov-report=term-missing:skip-covered
      - name: Résumé de la couverture
        if: always() && matrix.python == '3.12'
        run: |
          echo "## Couverture des tests" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

  licences:
    name: Licences (dépendances livrées)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Environnement neuf avec les seules dépendances de production : ce qui est livré.
      - name: Contrôle des licences
        run: |
          python -m venv /tmp/prod
          /tmp/prod/bin/pip install -r requirements.txt
          /tmp/prod/bin/python scripts/check_licenses.py --list
