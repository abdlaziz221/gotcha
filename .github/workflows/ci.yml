name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Lint et tests
    runs-on: ubuntu-latest
    # Décommenter quand PostgresStore est écrit (tâches A3 à A5) :
    # services:
    #   postgres:
    #     image: postgres:16
    #     env:
    #       POSTGRES_PASSWORD: postgres
    #       POSTGRES_DB: gotcha_test
    #     ports: ["5432:5432"]
    #     options: >-
    #       --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    # env:
    #   GOTCHA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gotcha_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Style (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (pytest)
        run: pytest

  licences:
    name: Licences des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Environnement neuf avec les seules dépendances de production : ce qui est livré.
      - run: pip install -r requirements.txt
      - run: python scripts/check_licenses.py --list
