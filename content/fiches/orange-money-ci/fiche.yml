country: CI
title: Orange Money Côte d'Ivoire
summary: Encaisser un paiement Orange Money en Côte d'Ivoire avec l'API Web Payment d'Orange, du bac à sable à la production.
api_version: v1
publication: draft
last_confirmed_on: 2026-11-03
prerequisites:
  - Être marchand Orange Money, inscrit dans une agence Orange de Côte d'Ivoire et conforme aux règles d'identification d'Orange (KYA).
  - Les documents de l'entreprise demandés par la législation locale, dont le registre du commerce (RCCM).
  - Une application sur developer.orange.com abonnée à Web Payment, qui donne la consumer key, le consumer secret et la merchant key.
differences:
  - topic: Adresse de l'API
    sandbox: https://api.orange.com/orange-money-webpay/dev/v1
    production: https://api.orange.com/orange-money-webpay/ci/v1
  - topic: Devise
    sandbox: OUV (devise fictive)
    production: XOF selon une intégration open source, à confirmer au premier paiement réel
