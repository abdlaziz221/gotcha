service:
  slug: orange-money
  name: Orange Money
  kind: payment
  operator: Orange
  docs_url: https://developer.orange.com/apis/om-webpay
country: SN
title: Orange Money Sénégal
summary: Encaisser un paiement Orange Money au Sénégal avec l'API Web Payment d'Orange, du bac à sable à la production.
api_version: v1
publication: draft
last_confirmed_on: 2026-11-03
prerequisites:
  - Être marchand Orange Money, inscrit dans une agence Orange du pays et conforme aux règles d'identification d'Orange (KYA). Une startup qui intègre pour un client doit être marchande, ou agir pour le compte d'un marchand.
  - Les documents de l'entreprise demandés par la législation locale, dont le registre du commerce (RCCM) ; le NINEA est cité par un guide non officiel, à confirmer.
  - Une application sur developer.orange.com abonnée à Web Payment, qui donne la consumer key, le consumer secret et la merchant key.
differences:
  - topic: Adresse de l'API
    sandbox: https://api.orange.com/orange-money-webpay/dev/v1
    production: https://api.orange.com/orange-money-webpay/sn/v1
  - topic: Devise
    sandbox: OUV (devise fictive)
    production: XOF selon un guide d'intégration, à confirmer au premier paiement réel
